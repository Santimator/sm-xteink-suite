name: Export Hermes public posts to EPUB

on:
  push:
    branches:
      - chatgpt/hermes-epub-20261106
    paths:
      - .github/workflows/export-hermes-epub.yml
      - tools/hermes_site_to_epub.py

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTML extraction dependencies
        run: python -m pip install --quiet requests beautifulsoup4 trafilatura
      - name: Build from publicly accessible posts
        run: python tools/hermes_site_to_epub.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vessel-of-hermes-public-epub
          path: |
            workspace/vessel-of-hermes-2026/build/*.epub
            workspace/vessel-of-hermes-2026/build/report.json
          if-no-files-found: warn
